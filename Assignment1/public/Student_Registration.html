<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Indiana University Kokomo - Student Registration</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #ebe8ea;
      }
      .banner {
        background: url("https://images.unsplash.com/photo-1596496054686-f5f7d6e0b55b?auto=format&fit=crop&w=1500&q=80")
          no-repeat center center;
        background-size: cover;
        height: 200px;
        position: relative;
        color: white;
      }
      .banner h1 {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: rgba(0, 0, 0, 0.5);
        padding: 10px 20px;
        border-radius: 10px;
      }
      .form-section {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      }
      table {
        background-color: white;
      }
    </style>
  </head>
  <body>
    <!-- Banner -->
    <div class="banner text-center mb-4">
      <h1>Indiana University Kokomo - Student Registration</h1>
    </div>

    <div class="container">
      <!-- Registration Form -->
      <div class="form-section mb-5">
        <h2 class="text-center mb-4">Register New Student</h2>
        <form id="studentForm">
          <div class="mb-3">
            <label for="name" class="form-label">Student Name</label>
            <input type="text" id="name" class="form-control" required />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              id="password"
              class="form-control"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Gender</label><br />
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="gender"
                id="male"
                value="Male"
                required
              />
              <label class="form-check-label" for="male">Male</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="gender"
                id="female"
                value="Female"
              />
              <label class="form-check-label" for="female">Female</label>
            </div>
          </div>

          <div class="mb-3">
            <label for="course" class="form-label">Course</label>
            <select id="course" class="form-select" required>
              <option value="">Select Course</option>
              <option value="Computer Science">Computer Science</option>
              <option value="Information Technology">
                Information Technology
              </option>
              <option value="Business Administration">
                Business Administration
              </option>
              <option value="Electrical Engineering">
                Electrical Engineering
              </option>
            </select>
          </div>

          <div class="text-center">
            <button
              type="button"
              class="btn btn-primary me-2"
              onclick="registerStudent()"
            >
              Register
            </button>
            <button type="reset" class="btn btn-secondary me-2">Clear</button>
            <button
              type="button"
              class="btn btn-success"
              onclick="viewRegisteredStudents()"
            >
              View Registered Students
            </button>
          </div>
        </form>
      </div>

      <!-- Registered Students Table -->
      <div id="studentsTableSection" class="mb-5" style="display: none">
        <h2 class="text-center mb-4">Registered Students</h2>
        <table class="table table-bordered table-striped">
          <thead class="table-dark">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Gender</th>
              <th>Course</th>
            </tr>
          </thead>
          <tbody id="studentsTableBody">
            <!-- Student records will appear here -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- JavaScript -->
    <script>
      let students = [];

      // Function to register student
      function registerStudent() {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const gender = document.querySelector('input[name="gender"]:checked');
        const course = document.getElementById("course").value;

        if (!name || !email || !password || !gender || !course) {
          alert("Please fill all fields correctly!");
          return;
        }

        // Add student to array
        students.push({
          name: name,
          email: email,
          gender: gender.value,
          course: course,
        });

        // Clear the form
        document.getElementById("studentForm").reset();

        alert("Student registered successfully!");
      }

      // Function to display registered students
      function viewRegisteredStudents() {
        const tableSection = document.getElementById("studentsTableSection");
        const tableBody = document.getElementById("studentsTableBody");

        // Clear previous data
        tableBody.innerHTML = "";

        if (students.length === 0) {
          alert("No students registered yet!");
          return;
        }

        students.forEach((student) => {
          tableBody.innerHTML += `
                <tr>
                    <td>${student.name}</td>
                    <td>${student.email}</td>
                    <td>${student.gender}</td>
                    <td>${student.course}</td>
                </tr>
            `;
        });

        tableSection.style.display = "block";
        // Scroll to the table
        tableSection.scrollIntoView({ behavior: "smooth" });
      }
    </script>
  </body>
</html>
